<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FFD700">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Sonnenwetter">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-180.png">
    <title>Sonnenwetter – Immer gutes Wetter</title>
    <style>
        :root {
            --sky: #7ec8f0;
            --sand: #fff3b0;
            --sun: #FFD700;
            --sun-dark: #e6b800;
            --ink: #2d2a26;
            --muted: #6b655c;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: linear-gradient(180deg, var(--sky) 0%, var(--sand) 100%);
            background-attachment: fixed;
            margin: 0;
            color: var(--ink);
            min-height: 100vh;
        }
        header {
            background: var(--sun);
            padding: calc(16px + env(safe-area-inset-top)) 20px 16px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,.15);
            position: sticky; top: 0; z-index: 2;
        }
        header h1 { margin: 0; font-size: 1.7rem; }
        header p { margin: 4px 0 0; font-size: .9rem; color: #5a4a00; }

        .container { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }

        .inputs {
            display: flex; flex-wrap: wrap; gap: 12px;
            justify-content: center; align-items: flex-end; margin-bottom: 24px;
        }
        .inputs label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
        input[type="date"], input[type="text"] {
            padding: 12px 14px; font-size: 1rem; border: 1px solid rgba(0,0,0,.15);
            border-radius: 10px; width: 220px; max-width: 100%; background: #fff;
        }
        button {
            padding: 12px 22px; font-size: 1rem; font-weight: 600; border: none;
            background: var(--sun); color: var(--ink); border-radius: 10px; cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,.15); transition: transform .1s, background .2s;
        }
        button:hover { background: var(--sun-dark); }
        button:active { transform: scale(.97); }

        .today {
            background: rgba(255,255,255,.85);
            backdrop-filter: blur(6px);
            border-radius: 20px; padding: 24px; margin-bottom: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,.12);
            display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center;
        }
        .today .icon { font-size: 4.5rem; line-height: 1; animation: float 4s ease-in-out infinite; }
        @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
        .today .temp { font-size: 3rem; font-weight: 700; margin: 0; }
        .today .desc { margin: 4px 0 0; color: var(--muted); }
        .today .tagline { margin: 10px 0 0; font-weight: 600; }
        .stats {
            grid-column: 1 / -1;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px;
        }
        .stat { background: rgba(255,215,0,.18); border-radius: 12px; padding: 10px; text-align: center; }
        .stat .v { font-weight: 700; font-size: 1.05rem; }
        .stat .l { font-size: .75rem; color: var(--muted); }

        .week { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; }
        .day-card {
            background: #fff; border-radius: 14px; padding: 16px 12px; text-align: center;
            box-shadow: 0 4px 12px rgba(0,0,0,.12); transition: transform .15s;
        }
        .day-card:hover { transform: translateY(-4px); }
        .day-card.is-today { outline: 3px solid var(--sun); }
        .day-card h3 { margin: 0; font-size: 1.05rem; }
        .day-card .date { font-size: .8rem; color: var(--muted); }
        .day-card .icon { font-size: 2.4rem; margin: 8px 0; }
        .day-card .temp { font-size: 1.4rem; font-weight: 700; margin: 0; }
        .day-card .tagline { font-size: .8rem; color: var(--muted); margin: 6px 0 0; min-height: 2.2em; }
        .day-card .rain { font-size: .8rem; margin-top: 6px; color: #2a7a2a; }

        .footer { text-align: center; margin-top: 36px; font-size: .85rem; color: var(--muted); }
        .footer small { display: block; margin-top: 4px; opacity: .7; }
        @media (max-width: 480px) {
            .today { grid-template-columns: 1fr; text-align: center; }
        }
    </style>
</head>
<body>
    <header>
        <h1 id="header-title">☀️ Wetter 📍 Konstanz</h1>
        <p>Die einzige Wetter-App mit 100 % Sonnengarantie</p>
    </header>

    <div class="container">
        <div class="inputs">
            <div>
                <label for="location-input">Standort</label>
                <input type="text" id="location-input" placeholder="z. B. Berlin" autocomplete="off">
            </div>
            <div>
                <label for="start-date">Ab Datum</label>
                <input type="date" id="start-date">
            </div>
            <button id="apply-button">Übernehmen</button>
        </div>

        <div class="today" id="today-card"></div>
        <div class="week" id="weather-container"></div>

        <div class="footer">
            &copy; 2025 Sonnenwetter – Joschka Peeters
            <small>Vorhersage-Genauigkeit: 100 % (für gutes Wetter)</small>
        </div>
    </div>

    <script>
        const weatherContainer = document.getElementById("weather-container");
        const todayCard = document.getElementById("today-card");
        const startDateInput = document.getElementById("start-date");
        const locationInput = document.getElementById("location-input");
        const applyButton = document.getElementById("apply-button");
        const headerTitle = document.getElementById("header-title");

        const days = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
        const icons = ["☀️", "☀️", "☀️", "🌤️", "😎", "🌞"];
        const descs = {
            "☀️": "Strahlender Sonnenschein", "🌤️": "Sonnig, ein Deko-Wölkchen",
            "😎": "Sonnenbrillen-Wetter", "🌞": "Sonne, Sonne, Sonne"
        };
        const taglines = [
            "Perfektes Grillwetter", "Eis geht immer", "Ab an den See!",
            "Sonnencreme nicht vergessen", "Fahrradwetter", "Biergarten ist offen",
            "Kein Regenschirm nötig", "Wie im Urlaub", "Flip-Flop-Tag", "Sonne satt"
        ];
        const winds = ["Windstill", "Laues Lüftchen", "Leichte Brise", "Angenehm frisch"];

        // Deterministischer Zufall: gleicher Tag + Ort = gleiches (gutes) Wetter
        function seededRandom(seed) {
            let h = 2166136261;
            for (let i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); }
            return () => { h += 0x6D2B79F5; let t = Math.imul(h ^ (h >>> 15), 1 | h);
                t ^= t + Math.imul(t ^ (t >>> 7), 61 | t); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        }
        const pick = (r, arr) => arr[Math.floor(r() * arr.length)];
        const between = (r, a, b) => Math.floor(r() * (b - a + 1)) + a;

        function forecastFor(date, location) {
            const key = date.toISOString().slice(0, 10) + "|" + location.toLowerCase();
            const r = seededRandom(key);
            const icon = pick(r, icons);
            const temp = between(r, 22, 29);
            const h = between(r, 5, 6), m = between(r, 0, 59);
            return {
                icon, temp, desc: descs[icon],
                low: temp - between(r, 6, 9),
                tagline: pick(r, taglines),
                uv: pick(r, ["Mittel", "Hoch"]),
                wind: pick(r, winds),
                humidity: between(r, 35, 55),
                sunrise: `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`,
                sunset: `${between(r, 20, 21)}:${String(between(r, 10, 59)).padStart(2,"0")}`,
                sunHours: between(r, 11, 14),
            };
        }

        function isSameDay(a, b) { return a.toDateString() === b.toDateString(); }

        function render(startDate, location) {
            const today = new Date();
            weatherContainer.innerHTML = "";
            for (let i = 0; i < 7; i++) {
                const d = new Date(startDate); d.setDate(d.getDate() + i);
                const f = forecastFor(d, location);
                const card = document.createElement("div");
                card.className = "day-card" + (isSameDay(d, today) ? " is-today" : "");
                card.innerHTML = `
                    <h3>${isSameDay(d, today) ? "Heute" : days[d.getDay()]}</h3>
                    <div class="date">${d.toLocaleDateString("de-DE")}</div>
                    <div class="icon">${f.icon}</div>
                    <p class="temp">${f.temp}°</p>
                    <div class="date">Nachts ${f.low}°</div>
                    <p class="tagline">${f.tagline}</p>
                    <div class="rain">💧 Regen: 0 %</div>
                `;
                weatherContainer.appendChild(card);
            }

            const f = forecastFor(startDate, location);
            const label = isSameDay(startDate, today) ? "Heute" : days[startDate.getDay()] + ", " + startDate.toLocaleDateString("de-DE");
            todayCard.innerHTML = `
                <div class="icon">${f.icon}</div>
                <div>
                    <div class="desc">${label} in ${location}</div>
                    <p class="temp">${f.temp}°C</p>
                    <p class="desc">${f.desc} · gefühlt wie Urlaub</p>
                    <p class="tagline">${f.tagline} 🙌</p>
                </div>
                <div class="stats">
                    <div class="stat"><div class="v">0 %</div><div class="l">Regen</div></div>
                    <div class="stat"><div class="v">${f.uv}</div><div class="l">UV-Index</div></div>
                    <div class="stat"><div class="v">${f.wind}</div><div class="l">Wind</div></div>
                    <div class="stat"><div class="v">${f.humidity} %</div><div class="l">Luftfeuchte</div></div>
                    <div class="stat"><div class="v">${f.sunHours} h</div><div class="l">Sonnenstunden</div></div>
                    <div class="stat"><div class="v">${f.sunrise} – ${f.sunset}</div><div class="l">Sonne auf/unter</div></div>
                </div>
            `;
            headerTitle.textContent = `☀️ Wetter 📍 ${location}`;
            document.title = `Sonnenwetter – ${location}`;
        }

        function updateWeather() {
            const selectedDate = new Date(startDateInput.value + "T12:00:00");
            const location = locationInput.value.trim() || "Konstanz";
            if (!isNaN(selectedDate)) {
                localStorage.setItem("sonnenwetter-ort", location);
                render(selectedDate, location);
            }
        }

        window.addEventListener("DOMContentLoaded", () => {
            const t = new Date();
            startDateInput.value = `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
            locationInput.value = localStorage.getItem("sonnenwetter-ort") || "Konstanz";
            updateWeather();
        });
        applyButton.addEventListener("click", updateWeather);
        [locationInput, startDateInput].forEach(el =>
            el.addEventListener("keydown", e => { if (e.key === "Enter") updateWeather(); }));

        // Offline-fähig als PWA (nur über http/https, nicht in Electron/file://)
        if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
            navigator.serviceWorker.register("sw.js").catch(() => {});
        }
    </script>
</body>
</html>
